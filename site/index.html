<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Lan Racing League — Resultat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E10600; --ink:#15151E; --ink-2:#38383F; --muted:#67676C;
  --line:#E7E7EA; --bg:#F7F4F1; --card:#FFFFFF; --hover:#F2F2F4; --ok:#1a7f37;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FFFFFF; --ink-2:#D6D6DB; --muted:#9A9AA2;
    --line:#2A2A32; --bg:#0E0E12; --card:#17171D; --hover:#1F1F27; --ok:#4ac26b;
  }
}
:root[data-theme="dark"]{
  --ink:#FFFFFF; --ink-2:#D6D6DB; --muted:#9A9AA2;
  --line:#2A2A32; --bg:#0E0E12; --card:#17171D; --hover:#1F1F27; --ok:#4ac26b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Titillium Web","Segoe UI",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.topbar{background:#2B2B2B;color:#fff;position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.brand .mark{width:6px;height:24px;background:var(--red);transform:skewX(-12deg)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;color:#B9B9C1;font-size:14px;font-weight:600;
  padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent}
.nav button:hover{color:#fff}
.nav button[aria-current="true"]{color:#fff;border-bottom-color:var(--red)}
.nav button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-.01em}
.season{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:7px 12px;font-size:14px;font-weight:600}
.cols{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

.side{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.side h2{font-size:13px;font-weight:700;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.side .item{display:block;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.side .item:last-child{border-bottom:0}
.side .item:hover{background:var(--hover)}
.side .item[aria-current="true"]{background:var(--red);color:#fff}
.side .rnd{font-size:11px;font-weight:700;opacity:.65;display:block}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:22px;font-weight:700}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:12px 14px;font-size:14px;font-weight:600;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--red)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.pos{font-weight:700;width:52px}
td.pts{font-weight:700;text-align:right}
th.num,td.num{text-align:right}
.driver{font-weight:700}
.driver .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
.win{color:var(--red);font-weight:700}
.p1 td.pos,.p2 td.pos,.p3 td.pos{color:var(--red)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:72ch}

textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;padding:12px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg);color:var(--ink);resize:vertical}
.btn{background:var(--red);color:#fff;border:0;border-radius:4px;padding:10px 18px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.form-grid label{font-size:12px;color:var(--muted);display:block}
.form-grid input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:4px;
  background:var(--bg);color:var(--ink);font-size:14px;font-weight:600}
.body-pad{padding:20px}
.msg{margin-top:12px;font-size:14px;font-weight:600;min-height:20px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--red)}
h3{font-size:16px;margin:26px 0 6px} h3:first-child{margin-top:0}
ul{padding-left:20px;color:var(--ink-2)} li{margin:5px 0}
.drop{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;
  color:var(--muted);cursor:pointer;margin-top:12px}
.drop.over{border-color:var(--red);color:var(--ink)}
</style>
</head>

const BRANDS=["Alfa Romeo","BMW","Audi","Opel","Renault","Volvo","Honda","Ford","Peugeot","Nissan","Toyota","Seat","Vauxhall","Mercedes"];

  rounds.forEach(r=>Object.values(r.sessions||{}).forEach(rows=>(rows||[]).forEach(([,n,v])=>{

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtDate(d){try{return new Date(d+"T12:00:00").toLocaleDateString("sv-SE",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}

/* ---------- Mästerskap ---------- */
function standings(){
  const drv={},team={};
  const ensure=(s,k,x)=>s[k]=s[k]||Object.assign({key:k,pts:0,wins:0,podiums:0,inc:0},x);
  rounds.forEach(r=>{
    const s=r.sessions||{};
    if(points.pole&&s.qualify&&s.qualify[0]){
      const[,n,v]=s.qualify[0];
      ensure(drv,keyOf(n,v),{name:n,vehicle:v}).pts+=points.pole;
      ensure(team,brandOf(v),{name:brandOf(v)}).pts+=points.pole;
    }
    ["race1","race2"].forEach(rk=>{
      let rows=s[rk]; if(!rows||!rows.length)return;

rows=adjustedRaceRows(rows,r.round,rk);

const fl=points.fastest?fastestOf(rows):null;
      rows.forEach(row=>{
        const[pos,n,v,,tf]=row, k=keyOf(n,v), b=brandOf(v);
        let p=finished(tf)?ptsForPos(pos):0;
        if(fl===row&&points.fastest&&finished(tf))p+=points.fastest;
        const d=ensure(drv,k,{name:n,vehicle:v}); d.pts+=p;
        if(pos===1)d.wins++; if(pos<=3)d.podiums++;
        const t=ensure(team,b,{name:b}); t.pts+=p; if(pos===1)t.wins++;
      });
      ((r.incidents||{})[rk]||[]).forEach(it=>{
        const row=rows.find(x=>x[1]===it.driver);
        if(!row)return;
        ensure(drv,keyOf(it.driver,row[2]),{name:it.driver,vehicle:row[2]}).inc+=it.points;
      });
    });
  });
  const sort=o=>Object.values(o).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.name.localeCompare(b.name,"sv"));
  return {drivers:sort(drv),teams:sort(team)};
}

/* ---------- Vyer ---------- */
let view="races", openRound=rounds.length?rounds[0].id:null, openTab="race1";
const app=document.getElementById("app"), nav=document.getElementById("nav");
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;render()}});

function head(t){return `<div class="page-head"><h1>${t}</h1>
  <span class="season">Säsong ${SEASON} · ${rounds.length} deltävling${rounds.length===1?"":"ar"}</span></div>`}

function render(){
  [...nav.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===view)));
  ({races:renderRaces,drivers:renderDrivers,teams:renderTeams,import:renderImport})[view]();
  window.scrollTo({top:0});
}

function renderRaces(){
  if(!rounds.length){
    app.innerHTML=head("Tävlingar")+`<div class="panel"><div class="empty">
      Inga deltävlingar ännu. Lägg till den första under <strong>Importera</strong>.</div></div>`;return;
  }
  const r=rounds.find(x=>x.id===openRound)||rounds[0]; openRound=r.id;
  const s=r.sessions||{}, inc=r.incidents||{};
  const avail=[];
  if((s.qualify||[]).length)avail.push(["qualify","Kval"]);
  if((s.race1||[]).length)avail.push(["race1","Race 1"]);
  if((s.race2||[]).length)avail.push(["race2","Race 2"]);
  const hasInc=Object.values(inc).some(a=>a&&a.length);
  if(hasInc)avail.push(["incidents","Incidenter"]);
  if(!avail.some(a=>a[0]===openTab))openTab=avail[0][0];

  let body;
  if(openTab==="incidents")body=incTable(r);
  else if(openTab==="qualify")body=qualTable(s.qualify);
  else body=raceTable(s[openTab],r.round,openTab);

  app.innerHTML=head("Tävlingar")+`
  <div class="cols">
    <aside class="side"><h2>Säsong ${SEASON}</h2>
      ${rounds.map(x=>`<div class="item" data-round="${esc(x.id)}" aria-current="${x.id===r.id}" role="button" tabindex="0">
        <span class="rnd">Deltävling ${x.round}</span>${esc(x.name)}</div>`).join("")}
    </aside>
    <section class="panel">
      <div class="panel-head"><h2>${esc(r.name)}</h2>
        <p>${esc(r.track||"")} · ${fmtDate(r.date)}${r.source?` · <a href="${esc(r.source)}" target="_blank" rel="noopener" style="color:var(--red);font-weight:600">Simresults</a>`:""}</p></div>
      <div class="tabs" id="tabs">${avail.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===openTab}">${l}</button>`).join("")}</div>
      <div class="tablewrap">${body}</div>
    </section></div>`;

  app.querySelectorAll("[data-round]").forEach(el=>{
    const go=()=>{openRound=el.dataset.round;render()};
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
  document.getElementById("tabs").addEventListener("click",e=>{
    const b=e.target.closest("button[data-tab]"); if(b){openTab=b.dataset.tab;render()}});
}

function qualTable(rows){
  return `<table><thead><tr><th>Pos</th><th>Förare</th><th>Bil</th><th class="num">Varv</th><th>Bästa varv</th><th>Diff</th></tr></thead><tbody>
  ${rows.map(([p,n,v,l,b,g])=>`<tr class="p${p}"><td class="pos">${p}</td>
    <td class="driver">${esc(n)}<span class="sub">${esc(brandOf(v))}</span></td>
    <td class="tag">${esc(v)}</td><td class="num">${l}</td><td>${esc(b)}</td><td>${esc(g)}</td></tr>`).join("")}
  </tbody></table>`;
}

function raceTable(rows,round,raceKey){
  rows=adjustedRaceRows(rows,round,raceKey);

  const fl=fastestOf(rows);

  return `<table><thead><tr><th>Pos</th><th>Förare</th><th>Bil</th><th class="num">Varv</th>
    <th>Tid/Diff</th><th>Bästa varv</th><th class="num">Poäng</th></tr></thead><tbody>
  ${rows.map((row,i)=>{
    const[p,n,v,l,t,b]=row;
    const ok=finished(t);
    const displayPos=i+1;
    const penalty=penaltyFor(round,raceKey,n);
    const isFl=fl===row&&points.fastest&&ok;

    let pts=(ok?ptsForPos(displayPos):0)+(isFl?points.fastest:0);

    const penaltyText=penalty
      ? ` <span class="win">↓ -${penalty.positions}</span>`
      : "";

    return `<tr class="p${displayPos}">
      <td class="pos">${displayPos}</td>
      <td class="driver">${esc(n)}${penaltyText}
        <span class="sub">${esc(brandOf(v))}${penalty?` · ${esc(penalty.reason)}`:""}</span>
      </td>
      <td class="tag">${esc(v)}</td>
      <td class="num">${l}</td>
      <td${ok?"":' class="win"'}>${esc(t)}</td>
      <td>${esc(b)}${isFl?' <span class="win">SV</span>':""}</td>
      <td class="pts">${pts||"—"}</td>
    </tr>`;
  }).join("")}
  </tbody></table>`;
}

function incTable(r){
  const inc=r.incidents||{};
  const all=[];
  Object.keys(inc).forEach(k=>(inc[k]||[]).forEach(i=>all.push(Object.assign({sess:k},i))));
  if(!all.length)return `<div class="empty">Inga incidenter registrerade.</div>`;
  const per={};
  all.forEach(i=>per[i.driver]=(per[i.driver]||0)+i.points);
  const list=Object.entries(per).sort((a,b)=>b[1]-a[1]);
  const label={race1:"Race 1",race2:"Race 2"};
  return `<table><thead><tr><th>Förare</th><th class="num">Incidentpoäng</th><th class="num">Antal</th></tr></thead><tbody>
  ${list.map(([n,p])=>`<tr><td class="driver">${esc(n)}</td><td class="pts">${p}</td>
    <td class="num">${all.filter(i=>i.driver===n).length}</td></tr>`).join("")}
  </tbody></table>
  <table style="margin-top:2px"><thead><tr><th>Session</th><th class="num">Varv</th><th>Förare</th><th>Motpart</th><th>Händelse</th><th class="num">Poäng</th></tr></thead><tbody>
  ${all.map(i=>`<tr><td class="tag">${label[i.sess]||i.sess}</td><td class="num">${i.lap}</td>
    <td class="driver">${esc(i.driver)}</td><td class="tag">${esc(i.other||"—")}</td>
    <td>${esc(i.type)}</td><td class="pts">${i.points}</td></tr>`).join("")}
  </tbody></table>`;
}

function renderDrivers(){
  const list=standings().drivers;
  app.innerHTML=head("Förarmästerskap")+`<section class="panel"><div class="tablewrap">
  <table><thead><tr><th>Pos</th><th>Förare</th><th>Bil</th><th class="num">Segrar</th>
    <th class="num">Pallplatser</th><th class="num">Incidentp.</th><th class="num">Poäng</th></tr></thead><tbody>
  ${list.map((d,i)=>`<tr class="p${i+1}"><td class="pos">${i+1}</td>
    <td class="driver">${esc(d.key)}</td><td class="tag">${esc(brandOf(d.vehicle))}</td>
    <td class="num">${d.wins}</td><td class="num">${d.podiums}</td>
    <td class="num">${d.inc||"—"}</td><td class="pts">${d.pts}</td></tr>`).join("")}
  </tbody></table></div></section>
  <p class="note">Poäng: ${points.table.join("–")} för placering 1–${points.table.length} i varje race${points.pole?`, +${points.pole} för pole`:""}${points.fastest?`, +${points.fastest} för snabbaste varv`:""}. Incidentpoäng kommer från Simresults och påverkar inte ställningen.</p>`;
}

function renderTeams(){
  const list=standings().teams;
  app.innerHTML=head("Märkesmästerskap")+`<section class="panel"><div class="tablewrap">
  <table><thead><tr><th>Pos</th><th>Märke</th><th class="num">Poäng</th></tr></thead><tbody>
  ${list.map((t,i)=>`<tr class="p${i+1}"><td class="pos">${i+1}</td>
    <td class="driver">${esc(t.name)}</td><td class="pts">${t.pts}</td></tr>`).join("")}
  </tbody></table></div></section>
  <p class="note">Poängen summeras per bilmärke, oavsett hur många förare som kör märket.</p>`;
}

/* ---------- CSV-parser (Simresults-export) ---------- */
function csvCells(line){
  const out=[];let cur="",q=false;
  for(const ch of line){
    if(ch==='"'){q=!q;continue}
    if(ch===","&&!q){out.push(cur);cur="";continue}
    cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim().replace(/^'/,"").trim());
}
const SEPLINE=/^'[+=]{5,}/;

function parseCSV(text){
  const lines=text.split(/\r?\n/);
  const meta={},sessions={},incidents={};
  const map={"Qualify":"qualify","Race":"race1","Race 1":"race1","Race 2":"race2","Race2":"race2"};
  let i=0;
  while(i<lines.length){
    const line=lines[i].trim();
    let m=line.match(/^(Date|Track|Game):?,\s*(.*)$/);
    if(m&&!meta[m[1].toLowerCase()])meta[m[1].toLowerCase()]=m[2].replace(/^"|"$/g,"").trim();

    m=line.match(/^(Practice|Qualify|Race ?\d*) result$/);
    if(m){
      const label=m[1].replace(/\s+/g," ").trim();
      const sess=map[label];
      i++; while(i<lines.length&&SEPLINE.test(lines[i].trim()))i++;
      const header=csvCells(lines[i]); i++;
      const rows=[];
      while(i<lines.length&&lines[i].trim()){
        const c=csvCells(lines[i]),o={};
        header.forEach((h,j)=>o[h]=c[j]!==undefined?c[j]:"");
        if(/^\d+$/.test(o["Pos"]||""))rows.push(o);
        i++;
      }
      if(sess)sessions[sess]=rows;
      continue;
    }

    m=line.match(/^Race ?(\d+) incidents$/);
    if(m){
      const sess="race"+m[1];
      i++; while(i<lines.length&&SEPLINE.test(lines[i].trim()))i++;
      i++;
      const items=[];
      while(i<lines.length&&lines[i].trim()){
        const c=csvCells(lines[i]);
        const it=parseIncident(c[1]||"");
        if(it)items.push(it);
        i++;
      }
      incidents[sess]=items;
      continue;
    }
    i++;
  }
  return {meta,sessions,incidents};
}

function parseIncident(txt){
  const m=txt.match(/^LAP (\d+),\s*(.*?),\s*Points:\s*(\d+)$/);
  if(!m)return null;
  const parts=m[2].split(",").map(s=>s.trim());
  return {lap:+m[1],driver:parts[0],other:parts.length>2?parts[1]:"",type:parts[parts.length-1],points:+m[3]};
}

function toRound(parsed,number,name,src){
  const {meta,sessions,incidents}=parsed;
  const out={sessions:{},incidents:{}};
  if(sessions.qualify)out.sessions.qualify=sessions.qualify.map(r=>
    [+r["Pos"],r["Driver"],r["Vehicle"],+(r["Laps"]||0),r["Best lap"]||"",r["Gap"]||"-"]);
  ["race1","race2"].forEach(k=>{
    const rows=sessions[k]; if(!rows)return;
    const maxLaps=Math.max(...rows.map(r=>+(r["Laps"]||0)));
    out.sessions[k]=rows.map(r=>{
      const laps=+(r["Laps"]||0); let t=r["Time/Retired"]||"";
      const down=maxLaps-laps;
      if(down>0&&finished(t))t=`+${down} varv`;
      return [+r["Pos"],r["Driver"],r["Vehicle"],laps,t,r["Best lap"]||"",+(r["Led"]||0)];
    });
  });
  Object.keys(incidents).forEach(k=>{if(incidents[k].length)out.incidents[k]=incidents[k]});
  const date=(meta.date||"").slice(0,10)||new Date().toISOString().slice(0,10);
  const track=meta.track||"";
  return Object.assign({
    id:"r"+Date.now(), round:number,
    name:name||track.split(",")[0].trim()||"Ny deltävling",
    track, date, source:src||""
  },out);
}

/* ---------- Import ---------- */
function renderImport(){
  app.innerHTML=head("Importera")+`
  <section class="panel"><div class="body-pad">
    <h3>Lägg till en deltävling</h3>
    ${LIVE?`<p class="note" style="margin-top:0;color:var(--red)">Sajten läser <code>data.json</code>, som byggs automatiskt från <code>races.json</code>. Lägg hellre till deltävlingen där — importen här är bara en tillfällig förhandsvisning i din egen webbläsare.</p>`:""}
    <p class="note" style="margin-top:0">Öppna resultatet på Simresults, klicka <strong>Export CSV</strong> och släpp filen här. Bana och datum läses ur filen.</p>
    <div class="drop" id="drop">Släpp CSV-filen här, eller klicka för att välja
      <input type="file" id="file" accept=".csv,text/csv" hidden></div>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--muted)">Klistra in innehållet istället</summary>
      <textarea id="f-data" placeholder="Klistra in hela CSV-filen här…" style="margin-top:10px"></textarea></details>
    <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      <div><label for="f-name">Namn (valfritt)</label><input id="f-name" placeholder="Läses från filen"></div>
      <div><label for="f-round">Deltävling nr</label><input id="f-round" type="number" min="1" value="${rounds.length+1}"></div>
      <div><label for="f-src">Simresults-länk</label><input id="f-src" placeholder="https://simresults.net/..."></div>
    </div>
    <div class="row">
      <button class="btn" id="btn-import">Lägg till deltävling</button>
      <button class="btn ghost" id="btn-reset">Återställ till ursprungsdata</button>
    </div>
    <div class="msg" id="msg"></div>

    <h3>Poängsystem</h3>
    <div class="form-grid">
      ${points.table.map((v,i)=>`<div><label for="pt${i}">P${i+1}</label><input id="pt${i}" type="number" value="${v}" min="0"></div>`).join("")}
      <div><label for="pt-pole">Pole</label><input id="pt-pole" type="number" value="${points.pole}" min="0"></div>
      <div><label for="pt-fl">Snabb. varv</label><input id="pt-fl" type="number" value="${points.fastest}" min="0"></div>
    </div>
    <div class="row"><button class="btn" id="btn-pts">Spara poängsystem</button></div>

    <h3>Deltävlingar i ligan</h3>
    ${rounds.length?`<ul>${rounds.map(r=>`<li>Deltävling ${r.round} — ${esc(r.name)} (${esc(r.date)})
      <a data-del="${esc(r.id)}" style="color:var(--red);cursor:pointer;font-weight:600">ta bort</a></li>`).join("")}</ul>`
      :`<p class="note">Inga ännu.</p>`}
  </div></section>`;

  const drop=document.getElementById("drop"), file=document.getElementById("file");
  drop.addEventListener("click",()=>file.click());
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");
    if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])});
  file.addEventListener("change",()=>{if(file.files[0])readFile(file.files[0])});

  document.getElementById("btn-import").addEventListener("click",()=>doImport(document.getElementById("f-data").value));
  document.getElementById("btn-pts").addEventListener("click",savePoints);
  document.getElementById("btn-reset").addEventListener("click",()=>{
    rounds=JSON.parse(JSON.stringify(SEED));save(KEY_ROUNDS,rounds);keyOf=buildKeyMap();render()});
  app.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{
    rounds=rounds.filter(r=>r.id!==el.dataset.del);save(KEY_ROUNDS,rounds);keyOf=buildKeyMap();render()}));
}

function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>doImport(String(rd.result));
  rd.onerror=()=>msg("Filen gick inte att läsa.",false);
  rd.readAsText(f);
}

function msg(t,ok){const e=document.getElementById("msg");if(e){e.textContent=t;e.className="msg "+(ok?"ok":"err")}}

function doImport(text){
  if(!text||!text.trim())return msg("Välj en CSV-fil eller klistra in innehållet först.",false);
  let parsed;
  try{parsed=parseCSV(text)}catch(e){return msg("Kunde inte tolka filen: "+e.message,false)}
  const n=Object.values(parsed.sessions).reduce((a,r)=>a+r.length,0);
  if(!n)return msg("Hittade inga resultatrader. Är det en CSV-export från Simresults?",false);

  const r=toRound(parsed,
    parseInt(document.getElementById("f-round").value)||rounds.length+1,
    document.getElementById("f-name").value.trim(),
    document.getElementById("f-src").value.trim());
  rounds.push(r); rounds.sort((a,b)=>a.round-b.round);
  if(!save(KEY_ROUNDS,rounds))return msg("Kunde inte spara i den här webbläsaren.",false);
  keyOf=buildKeyMap(); openRound=r.id;
  const sum=Object.keys(r.sessions).map(k=>`${k} (${r.sessions[k].length})`).join(", ");
  msg(`Tillagd: ${r.name} — ${sum}.`,true);
  setTimeout(()=>{view="races";render()},900);
}

function savePoints(){
  points={
    table:points.table.map((_,i)=>Math.max(0,parseInt(document.getElementById("pt"+i).value)||0)),
    pole:Math.max(0,parseInt(document.getElementById("pt-pole").value)||0),
    fastest:Math.max(0,parseInt(document.getElementById("pt-fl").value)||0)
  };
  save(KEY_PTS,points);
  msg("Poängsystemet är sparat.",true);
}

async function boot(){
  try{
    const res=await fetch("data.json?v="+Date.now(),{cache:"no-store"});
    if(res.ok){
      const d=await res.json();
      if(d&&Array.isArray(d.rounds)&&d.rounds.length){
        rounds=d.rounds.slice().sort((a,b)=>a.round-b.round);
        openRound=rounds[0].id;
        if(d.points&&d.points.table)points=Object.assign({},DEFAULT_PTS,d.points,load(KEY_PTS,{})||{});
        if(d.season)SEASON=d.season;
        if(d.league){LEAGUE=d.league;
          document.querySelector(".brand").innerHTML=
            '<span class="mark"></span> '+d.league.toUpperCase();
          document.title=d.league+" — Resultat";}
        keyOf=buildKeyMap();
        LIVE=true;
      }
    }
  }catch(e){/* ingen data.json — kör med inbyggd data */}
  render();
}
let LIVE=false;
boot();
</script>
</body>
